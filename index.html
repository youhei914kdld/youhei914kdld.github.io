<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乱数の偏りチェック</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .log { margin-top: 20px; font-size: 18px; }
    #notification { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>地震と乱数の偏り</h1>
  <div id="earthquake" class="log"></div>
  <div id="deviation" class="log"></div>
  <div id="notification"></div>
  
  <script>
    let randomLog = [];

    // 1秒に100回乱数生成
    setInterval(() => {
      const now = new Date();
      for (let i = 0; i < 100; i++) {
        randomLog.push({
          time: now.toISOString(),
          value: Math.random()
        });
      }
      // 1時間分の乱数を保持
      if (randomLog.length > 360000) randomLog.splice(0, randomLog.length - 360000); 
    }, 1000);

    // 地震情報取得
    async function getJMAQuakeData() {
      const response = await fetch("https://www.jma.go.jp/bosai/quake/data/list.json");
      const data = await response.json();
      const latestQuake = data.data[0]; // 最新の地震情報を取得
      const quakeTime = new Date(latestQuake.originTime); // 地震の発生時間
      return {
        time: quakeTime,
        info: latestQuake
      };
    }

    // 乱数の偏りを計算
    function getAroundQuakeData(quakeTime) {
      const start = new Date(quakeTime.getTime() - 2 * 60 * 1000); // 地震前2分
      const end = new Date(quakeTime.getTime() + 2 * 60 * 1000); // 地震後2分
      const values = randomLog
        .filter(r => new Date(r.time) >= start && new Date(r.time) <= end)
        .map(r => r.value);

      if (values.length === 0) {
        return { avg: 0, deviation: 0 }; // データがない場合は0にする
      }

      const avg = values.reduce((a, b) => a + b, 0) / values.length;  // 平均値計算
      const deviation = Math.abs(avg - 0.5) * 100 / 0.5; // 0.5からの偏り計算（0.5は乱数の平均値）
      return { avg, deviation: deviation.toFixed(2), values };
    }

    // 情報の表示
    async function displayInfo() {
      const quake = await getJMAQuakeData();
      document.getElementById("earthquake").innerText = `最新地震: ${quake.time.toLocaleString()} / 地域: ${quake.info.hypoName} / M${quake.info.mag} / 震度${quake.info.maxScale / 10}`;
      const result = getAroundQuakeData(quake.time);
      document.getElementById("deviation").innerText = `前後2分間の乱数平均: ${result.avg.toFixed(3)} / 偏り率: ${result.deviation}%`;
      if (parseFloat(result.deviation) >= 10) {
        document.getElementById("notification").innerText = "※ 異常な偏りを検出しました ※";
      } else {
        document.getElementById("notification").innerText = "";
      }
    }

    // 5秒ごとに情報更新
    setInterval(displayInfo, 5000);
  </script>
</body>
</html>
