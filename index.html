<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乱数生成と偏りの記録</title>
</head>
<body>
  <h1>乱数生成と偏りの記録</h1>

  <h2>乱数ログ</h2>
  <table id="logTable" border="1">
    <thead>
      <tr>
        <th>日時</th>
        <th>乱数結果</th>
        <th>偏り％</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>時間指定でデータを検索</h2>
  <label for="startDate">開始日時:</label>
  <input type="datetime-local" id="startDate">
  <label for="endDate">終了日時:</label>
  <input type="datetime-local" id="endDate">
  <button onclick="filterByTime()">検索</button>

  <script>
    let logData = []; // 乱数と偏りデータを保存する配列
    const biasThreshold = 100; // 偏りのしきい値（100%）

    // 1秒間に100回乱数を生成して保存する
    function generateRandomNumbers() {
      const randomNumbers = [];
      for (let i = 0; i < 100; i++) {
        const rand = Math.floor(Math.random() * 10) + 1; // 1〜10の乱数
        randomNumbers.push(rand);
      }

      // 偏りの計算
      const bias = calculateBias(randomNumbers);

      // 偏りがしきい値を超えていたら保存
      if (Math.abs(bias) >= biasThreshold) {
        const timestamp = new Date().toLocaleString();
        logData.push({ timestamp, randomNumbers, bias });

        // ログをテーブルに追加
        updateLogTable();
      }
    }

    // 偏り計算関数
    function calculateBias(numbers) {
      const counts = Array(10).fill(0); // 1〜10の出現回数を記録
      numbers.forEach(num => counts[num - 1]++);
      
      // 期待値（各数字が出る回数）
      const expected = numbers.length / 10;

      // 偏り計算
      let bias = 0;
      counts.forEach(count => {
        bias += Math.abs(count - expected);
      });

      return (bias / numbers.length) * 100; // 偏りをパーセンテージで返す
    }

    // ログテーブルを更新
    function updateLogTable() {
      const tableBody = document.querySelector("#logTable tbody");
      tableBody.innerHTML = ""; // テーブルをクリア

      // 新しいデータをテーブルに追加
      logData.forEach(entry => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${entry.timestamp}</td>
          <td>${entry.randomNumbers.join(", ")}</td>
          <td>${entry.bias.toFixed(2)}%</td>
        `;
        tableBody.appendChild(row);
      });
    }

    // 1秒ごとに乱数生成
    setInterval(generateRandomNumbers, 1000);

    // 時間指定でデータをフィルタリングする関数
    function filterByTime() {
      const startDate = new Date(document.getElementById("startDate").value);
      const endDate = new Date(document.getElementById("endDate").value);

      const filteredData = logData.filter(entry => {
        const timestamp = new Date(entry.timestamp);
        return timestamp >= startDate && timestamp <= endDate;
      });

      // フィルタリングされたデータを表示
      const tableBody = document.querySelector("#logTable tbody");
      tableBody.innerHTML = ""; // テーブルをクリア

      // 新しいデータをテーブルに追加
      filteredData.forEach(entry => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${entry.timestamp}</td>
          <td>${entry.randomNumbers.join(", ")}</td>
          <td>${entry.bias.toFixed(2)}%</td>
        `;
        tableBody.appendChild(row);
      });
    }
  </script>
</body>
</html>
