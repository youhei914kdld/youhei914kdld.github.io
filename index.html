<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>乱数生成と偏りの記録</title>
  <style>
    body { font-family: sans-serif; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #888; padding: 6px; text-align: center; }
    th { background-color: #f0f0f0; }
  </style>
</head>
<body>

<h1>乱数生成と偏りの記録</h1>
<p>このサイトは24時間乱数を記録しているサイトです。この乱数は1秒間に100個生成されていて偏りの%が異常値になっているものを記録します。<br>
確率でありえないことが起きているなら世界のどこかで同じような事象が起きていてもおかしくないと思い作ってみました。</p>
<p>作成者: もりこ｜<a href="https://x.com/moriko891212654?s=09" target="_blank">Twitterアカウント</a></p>

<h2>偏りログ</h2>
<table id="logTable">
  <thead>
    <tr>
      <th>日時</th>
      <th>乱数結果</th>
      <th>偏り%</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<h2>時間指定でデータを検索</h2>
<input type="datetime-local" id="endDate">
<button onclick="filterByTime()">検索</button>

<script>
  // テスト用データ（後でJSONやリアルデータに差し替え）
  const data = [
    { time: "2025-05-01T15:00:00", result: "1,2,3,...", deviation: "+110%" },
    { time: "2025-05-01T18:30:00", result: "2,2,2,...", deviation: "-105%" }
  ];

  function populateTable(entries) {
    const tbody = document.querySelector("#logTable tbody");
    tbody.innerHTML = "";
    entries.forEach(entry => {
      const row = document.createElement("tr");
      row.innerHTML = `<td>${entry.time}</td><td>${entry.result}</td><td>${entry.deviation}</td>`;
      tbody.appendChild(row);
    });
  }

  function filterByTime() {
    const selected = document.getElementById("endDate").value;
    const filtered = data.filter(item => item.time >= selected);
    populateTable(filtered);
  }

  window.onload = () => populateTable(data);
</script>
  <script>
const INTERVAL_MS = 1000; // 1秒ごと
const COUNT_PER_SEC = 100; // 1秒間に100個の乱数
const RANGE = 10; // 1〜10
const THRESHOLD_PERCENT = 100; // ±100%以上を記録

// 偏りログの取得
let logs = JSON.parse(localStorage.getItem('biasLogs') || '[]');

// 偏りを表示する関数
function updateLogTable() {
    const table = document.getElementById('logTable');
    table.innerHTML = "<tr><th>日時</th><th>偏りのある値</th><th>出現数</th><th>偏り%</th></tr>";

    logs.sort((a, b) => Math.abs(b.deviation) - Math.abs(a.deviation));
    for (const log of logs) {
        const row = table.insertRow();
        row.insertCell().innerText = log.time;
        row.insertCell().innerText = log.value;
        row.insertCell().innerText = log.count;
        row.insertCell().innerText = `${log.deviation}%`;
    }
}

// 乱数生成と偏りチェック
function generateAndCheck() {
    const counts = Array(RANGE).fill(0);
    for (let i = 0; i < COUNT_PER_SEC; i++) {
        const rand = Math.floor(Math.random() * RANGE);
        counts[rand]++;
    }

    const time = new Date().toISOString();

    counts.forEach((count, i) => {
        const expected = COUNT_PER_SEC / RANGE;
        const deviation = ((count - expected) / expected) * 100;

        if (Math.abs(deviation) >= THRESHOLD_PERCENT) {
            logs.push({
                time,
                value: i + 1,
                count,
                deviation: Math.round(deviation)
            });
            localStorage.setItem('biasLogs', JSON.stringify(logs));
            updateLogTable();
        }
    });
}

// 初期表示
updateLogTable();

// 毎秒乱数生成
setInterval(generateAndCheck, INTERVAL_MS);
</script>

</body>
</html>
