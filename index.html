<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>乱数 モニター</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; background: #f9f9f9; color: #333; }
    h1, h2 { text-align: center; }
    .card { background: white; padding: 1rem; border-radius: 1rem; box-shadow: 0 0 10px #ccc; margin: 1rem 0; }
    .log { font-family: monospace; white-space: pre-wrap; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>乱数 モニター</h1>

  <div class="card">
    <h2>乱数偏り計算</h2>
    <div id="deviation" class="log">乱数の偏りを計算します。</div>
  </div>

  <script>
    let randomLog = [];

    // 1秒に100回乱数生成
    setInterval(() => {
      const now = new Date();
      for (let i = 0; i < 100; i++) {
        randomLog.push(Math.random());
      }
      if (randomLog.length > 360000) randomLog.splice(0, randomLog.length - 360000); // 1時間分保持
    }, 1000);

    // 偏り計算を表示
    function calculateDeviation() {
      const avg = randomLog.reduce((a, b) => a + b, 0) / randomLog.length;
      const deviation = Math.abs(avg - 0.5) * 100 / 0.5;
      document.getElementById("deviation").innerText = `乱数平均: ${avg.toFixed(3)} / 偏り率: ${deviation.toFixed(2)}%`;
    }

    // 10秒ごとに偏り計算
    setInterval(calculateDeviation, 10000);
  </script>
</body>
</html>
