<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>乱数生成と偏りの記録</title>
  <style>
    body { font-family: sans-serif; }
    table { border-collapse: collapse; width: 75%; }
    th, td { border: 1px solid #888; padding: 6px; text-align: center; }
    th { background-color: #f0f0f0; }
  </style>
</head>
<body>

<h1>乱数生成と偏りの記録</h1>
<p>このサイトは24時間乱数を記録しているサイトです。この乱数は1秒間に100個生成されていて、偏りの%が0.3%程度で異常値を記録します。<br>
確率でありえないことが起きているなら世界のどこかで同じような事象が起きていてもおかしくないと思い作ってみました。</p>
<p>作成者: もりこ｜<a href="https://x.com/moriko891212654?s=09" target="_blank">Twitterアカウント</a></p>

<h2>偏りログ</h2>
<table id="logTable">
  <thead>
    <tr>
      <th>日時</th>
      <th>乱数結果</th>
      <th>偏り%</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<h2>時間指定でデータを検索</h2>
<p>検索する範囲を指定してください（開始日時と終了日時）:</p>
<input type="datetime-local" id="startDate">
<input type="datetime-local" id="endDate">
<button onclick="filterByRange()">検索</button>

<script>
  // 偏りログの取得
  let logs = JSON.parse(localStorage.getItem('biasLogs') || '[]');

  function filterByRange() {
    const startSelected = document.getElementById("startDate").value;
    const endSelected = document.getElementById("endDate").value;

    if (!startSelected || !endSelected) return;

    const startDate = new Date(startSelected).toISOString();
    const endDate = new Date(endSelected).toISOString();

    // 開始日時と終了日時の範囲内のデータをフィルタリング
    const filtered = logs.filter(item => item.time >= startDate && item.time <= endDate);

    const tbody = document.querySelector("#logTable tbody");
    tbody.innerHTML = "";

    filtered.sort((a, b) => Math.abs(b.deviation) - Math.abs(a.deviation));
    for (const log of filtered) {
      const row = document.createElement("tr");
      row.innerHTML = `<td>${log.time}</td><td>${log.value} × ${log.count}</td><td>${log.deviation}%</td>`;
      tbody.appendChild(row);
    }
  }

  // 偏りを表示する関数
  function updateLogTable() {
    const tbody = document.querySelector('#logTable tbody');
    tbody.innerHTML = "";

    logs.sort((a, b) => Math.abs(Number(b.deviation)) - Math.abs(Number(a.deviation)));
    for (const log of logs) {
      const row = document.createElement("tr");
      row.innerHTML = `<td>${log.time}</td><td>${log.value} × ${log.count}</td><td>${log.deviation}%</td>`;
      tbody.appendChild(row);
    }
  }

  // 乱数生成と偏りチェック
  function generateAndCheck() {
    const counts = Array(10).fill(0); // 1〜10の乱数
    const countPerSec = 100; // 1秒間に100個
    for (let i = 0; i < countPerSec; i++) {
      const rand = Math.floor(Math.random() * 10); // 0から9の乱数
      counts[rand]++;
    }

    const time = new Date().toISOString();

    counts.forEach((count, i) => {
      const expected = countPerSec / 10;
      const deviation = ((count - expected) / expected) * 100;

      if (Math.abs(deviation) >= 1000) { // 1000%の偏りで記録
        logs.push({
          time,
          value: i + 1,
          count,
          deviation: Math.round(deviation)
        });

        // ログを1000件までに制限（新しい順で残す）
        if (logs.length > 1000) {
          logs = logs.slice(logs.length - 1000);
        }

        localStorage.setItem('biasLogs', JSON.stringify(logs));
        updateLogTable();
      }
    });
  }

  // 初期表示
  updateLogTable();

  // 毎秒乱数生成
  setInterval(generateAndCheck, 1000);
</script>

</body>
  <button onclick="clearLogs()">すべての記録を削除</button>

<script>
  function clearLogs() {
    if (confirm("本当にすべての記録を削除しますか？")) {
      localStorage.removeItem('biasLogs');
      logs = [];
      updateLogTable();
    }
  }
</script>
</html>
