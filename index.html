<button onclick="saveBias()">偏りを保存する</button>

<script>
function saveBias() {
  // 保存したいデータ（例として偏り情報）
  const biasData = {
    timestamp: new Date().toISOString(),
    result: {
      1: 6,
      2: 9,
      3: 25,  // ← 偏りが大きかった数字
      4: 8,
      5: 10,
      6: 12,
      7: 9,
      8: 11,
      9: 5,
      10: 5
    },
    biasPercent: "+150%"
  };

  // Blobを作ってJSONに変換
  const blob = new Blob([JSON.stringify(biasData, null, 2)], { type: 'application/json' });

  // ダウンロードリンクを自動作成・クリック
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `bias-${Date.now()}.json`;
  link.click();
}
</script>
