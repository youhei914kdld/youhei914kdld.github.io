<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>地震×乱数偏りモニタ</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
    h1 { font-size: 24px; }
    .highlight { color: red; font-weight: bold; }
    footer { text-align: center; margin-top: 40px; color: gray; }
    button { margin: 10px 0; }
    .quake-time { margin: 10px 0; font-size: 18px; }
    .log-table { background: white; border-collapse: collapse; width: 100%; margin-top: 10px; }
    .log-table th, .log-table td { border: 1px solid #ccc; padding: 6px; text-align: center; }
  </style>
</head>
<body>

<h1>地震直前5分間の乱数の偏りモニター</h1>

<p>
このサイトでは、<strong>日本の気象庁（JMA）による地震情報</strong>をもとに、<br>
<strong>地震が発生した直前5分間</strong>に生成された0〜1の乱数の偏りを観測しています。<br>
乱数は0.1秒ごとに100個、24時間ノンストップで生成・記録されています。
</p>

<p>
<strong>偏り率</strong>はその時間帯における「0.5以上の乱数の割合」です。<br>
±10%以上の偏りが検出された場合、赤色で表示されます。
</p>

<div class="quake-time" id="latest-quake">最新の地震：読み込み中...</div>

<button onclick="toggleNotifications()">通知: <span id="notifyStatus">OFF</span></button>

<table class="log-table" id="log-table">
  <thead>
    <tr><th>時刻</th><th>乱数</th></tr>
  </thead>
  <tbody></tbody>
</table>

<div id="bias-result"></div>

<footer>
  作成者：もりこ /  
  <a href="https://x.com/moriko891212654?s=09" target="_blank">X（旧Twitter）</a>
</footer>

<script>
let randomLog = [];
let notificationsOn = false;

function toggleNotifications() {
  notificationsOn = !notificationsOn;
  document.getElementById('notifyStatus').textContent = notificationsOn ? "ON" : "OFF";
}

function generateRandomData() {
  const now = new Date();
  for (let i = 0; i < 100; i++) {
    const time = new Date(now.getTime());
    time.setMilliseconds(time.getMilliseconds() + i);
    const timestamp = time.toISOString().slice(0, 19).replace('T', ' ');
    randomLog.push([timestamp, Math.random()]);
  }
  // メモリ管理
  if (randomLog.length > 100000) {
    randomLog = randomLog.slice(-100000);
  }
}

setInterval(generateRandomData, 100); // 0.1秒ごとに100回分

async function getLatestEarthquake() {
  const res = await fetch("https://www.jma.go.jp/bosai/quake/data/list.json");
  const data = await res.json();
  const latest = data[0];
  const quakeTime = latest.Time.split('+')[0].replace('T', ' ');
  document.getElementById("latest-quake").textContent = "最新の地震：" + quakeTime;
  showRandomAroundEarthquake(quakeTime);
}

function showRandomAroundEarthquake(quakeTime) {
  const quakeDate = new Date(quakeTime);
  const start = new Date(quakeDate.getTime() - 5 * 60 * 1000); // 5分前
  const filtered = randomLog.filter(([ts, _]) => {
    const dt = new Date(ts);
    return dt >= start && dt <= quakeDate;
  });

  const tbody = document.querySelector("#log-table tbody");
  tbody.innerHTML = "";
  let overHalf = 0;
  filtered.forEach(([ts, val]) => {
    if (val >= 0.5) overHalf++;
    const row = document.createElement("tr");
    row.innerHTML = `<td>${ts}</td><td>${val.toFixed(3)}</td>`;
    tbody.appendChild(row);
  });

  const rate = filtered.length ? (overHalf / filtered.length) * 100 : 0;
  const bias = Math.abs(rate - 50);
  const resultDiv = document.getElementById("bias-result");
  resultDiv.innerHTML = `偏り率: <span class="${bias >= 10 ? 'highlight' : ''}">${rate.toFixed(1)}%</span>`;
  if (notificationsOn && bias >= 10) alert("乱数の偏りが検出されました！");
}

setInterval(getLatestEarthquake, 30000); // 30秒おきにチェック
</script>

</body>
</html>
