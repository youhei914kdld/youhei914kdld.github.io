<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地震×乱数偏りモニタ</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 1em; background: #f9f9f9; }
    h1 { font-size: 1.4em; margin-bottom: 0.5em; }
    p { font-size: 0.9em; line-height: 1.5em; }
    .section { margin-bottom: 1.5em; }
    .highlight { color: red; font-weight: bold; }
    .quake-time { font-size: 1em; margin-top: 1em; }
    .search-box { margin: 1em 0; }
    input[type="datetime-local"] {
      width: 100%;
      padding: 0.5em;
      font-size: 1em;
      margin-bottom: 0.5em;
    }
    button {
      padding: 0.5em;
      font-size: 1em;
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85em;
      margin-top: 1em;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 4px;
      text-align: center;
    }
    footer {
      font-size: 0.8em;
      text-align: center;
      margin-top: 2em;
      color: gray;
    }
    a { color: #007bff; text-decoration: none; }
    .sortable th {
      cursor: pointer;
    }
    .sortable th:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>

<h1>地震×乱数偏りモニタ</h1>

<p>このページでは、地震発生時の乱数データを表示し、地震前後5分間のデータとその偏り具合を監視することができます。</p>

<!-- 検索ボックス -->
<div class="search-box">
  <label for="search-time">指定した時間から検索：</label>
  <input type="datetime-local" id="search-time" name="search-time">
  <button onclick="searchByTime()">検索</button>
</div>

<!-- 地震データ表示 -->
<div id="earthquake-info" class="section">
  <h2>最新の地震情報</h2>
  <table id="earthquake-table">
    <thead>
      <tr>
        <th>発生時刻</th>
        <th>震度</th>
        <th>マグニチュード</th>
        <th>地方</th>
        <th>偏り具合</th>
      </tr>
    </thead>
    <tbody>
      <!-- 地震データがここに追加されます -->
    </tbody>
  </table>
</div>

<footer>
  <p>作成者: もりこ | <a href="https://x.com/moriko891212654?s=09" target="_blank">Twitter</a></p>
</footer>

<script>
  // 地震データを取得する関数
  async function fetchEarthquakeData() {
    const response = await fetch('https://www.jma.go.jp/bosai/quake/data/list.json');
    const data = await response.json();
    return data.earthquakes;
  }

  // 地震データを表示する関数
  function displayEarthquakeData(earthquakes) {
    const tableBody = document.querySelector('#earthquake-table tbody');
    tableBody.innerHTML = ''; // 一度内容をリセット

    earthquakes.forEach((quake) => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${quake.time}</td>
        <td>${quake.shindo}</td>
        <td>${quake.magnitude}</td>
        <td>${quake.region}</td>
        <td>${quake.deviation}</td>
      `;
      tableBody.appendChild(row);
    });
  }

  // 検索機能
  function searchByTime() {
    const searchTime = document.getElementById('search-time').value;
    if (!searchTime) {
      alert('時間を指定してください');
      return;
    }
    const searchDate = new Date(searchTime);
    // ここで指定した時間に基づいて検索処理
    alert('検索機能はまだ実装されていません');
  }

  // 地震データの並び替え
  function sortTable(columnIndex) {
    const table = document.getElementById('earthquake-table');
    const rows = Array.from(table.rows).slice(1); // ヘッダーを除外
    const sortedRows = rows.sort((rowA, rowB) => {
      const cellA = rowA.cells[columnIndex].innerText;
      const cellB = rowB.cells[columnIndex].innerText;

      if (!isNaN(cellA) && !isNaN(cellB)) {
        return parseFloat(cellA) - parseFloat(cellB);
      } else {
        return cellA.localeCompare(cellB);
      }
    });

    sortedRows.forEach(row => table.appendChild(row));
  }

  // ページ読み込み時に地震データを取得
  document.addEventListener('DOMContentLoaded', async () => {
    const earthquakeData = await fetchEarthquakeData();
    displayEarthquakeData(earthquakeData);

    // 並び替え機能を追加
    document.querySelectorAll('.sortable th').forEach((th, index) => {
      th.addEventListener('click', () => sortTable(index));
    });
  });
</script>

</body>
</html>
